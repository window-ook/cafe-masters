name: Production 배포

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: pnpm 캐시 설정
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 체크
        run: npx tsc --noEmit
        continue-on-error: true

      - name: 린트 검사
        run: pnpm run lint
        continue-on-error: true

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps

      - name: 테스트용 개발 서버 실행 및 테스트 실행
        run: |
          pnpm run dev &
          echo "개발 서버 시작 중..."

          # 서버가 완전히 준비될 때까지 대기 (최대 60초)
          for i in {1..60}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "서버가 준비되었습니다! ($i초 후)"
              break
            fi
            echo "서버 준비 대기 중... ($i/60)"
            sleep 1
          done

          # 추가 안정화 시간
          sleep 5
          echo "테스트 시작"
          pnpm run test:playwright
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY }}

      - name: Vercel CLI 설치
        run: pnpm add --global vercel@latest

      - name: Vercel 환경 정보 가져오기 (Production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 프로젝트 빌드
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel에 Production 배포
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 배포 성공 알림
        if: success()
        run: |
          echo "✅ Production 환경에 성공적으로 배포되었습니다!"
