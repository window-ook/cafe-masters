name: Production 배포

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# main은 운영 전용입니다. develop → main 병합(릴리스)만 운영에 배포합니다
on:
  push:
    branches:
      - main

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: pnpm 캐시 설정
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 타입 오류는 거의 항상 실제 문제이므로 배포를 막습니다
      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 린트 검사
        run: pnpm run lint
        continue-on-error: true

      - name: Vercel CLI 설치
        run: pnpm add --global vercel@latest

      - name: Vercel 환경 정보 가져오기 (Production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 프로젝트 빌드
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel에 Production 배포
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 배포 성공 알림
        if: success()
        run: |
          echo "✅ Production 환경에 성공적으로 배포되었습니다!"

  # 배포 직후 운영 URL에서 지도·검색을 확인합니다. 실패해도 이미 나간 배포는 되돌리지 않으므로 알림 역할입니다
  Smoke:
    needs: Deploy-Production
    uses: ./.github/workflows/smoke.yml
