name: Preview 배포

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# develop 대상 PR마다 미리보기를 만듭니다. develop에 병합된 결과는 staging.yml이 배포합니다
on:
  pull_request:
    branches:
      - develop

# 저장소 기본 토큰은 읽기 전용이라, PR에 미리보기 주소 댓글을 남기려면 쓰기 권한을 명시합니다
permissions:
  contents: read
  pull-requests: write

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: pnpm 캐시 설정
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 타입 오류는 거의 항상 실제 문제이므로 배포를 막습니다
      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 린트 검사
        run: pnpm run lint
        continue-on-error: true

      - name: Vercel CLI 설치
        run: pnpm add --global vercel@latest

      - name: Vercel 환경 정보 가져오기 (Preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: 프로젝트 빌드
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel Preview 배포
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "PREVIEW_URL=$url" >> $GITHUB_OUTPUT
          echo "🚀 Preview 배포 완료!"
          echo "Preview URL: $url"

      - name: 배포 코멘트
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { PREVIEW_URL } = process.env;
            const comment = `
            ## 🚀 Preview 배포 완료!

            **Preview URL:** ${PREVIEW_URL}

            **배포 브랜치:** \`${{ github.ref_name }}\`
            **커밋:** \`${{ github.sha }}\`

            배포된 사이트에서 변경사항을 확인해보세요! ✨
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.PREVIEW_URL }}

      - name: 배포 성공
        if: success()
        run: |
          echo "✅ Preview 환경에 성공적으로 배포되었습니다!"
