<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafe Masters — 디스플레이 서체 비교</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Space+Grotesk:wght@700&family=Unbounded:wght@800&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Chivo:wght@900&family=Bebas+Neue&family=Big+Shoulders+Display:wght@800&display=swap">

<style>
  :root {
    --ink: #10141c; --panel: #171d28; --line: #2a3446;
    --text: #dfe5ef; --dim: #7e8ca4; --brand: #da483b; --cream: #efe9dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--ink); color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1 { margin: 0 0 4px; font-size: 15px; letter-spacing: .04em; }
  .sub { margin: 0 0 18px; color: var(--dim); font-size: 12px; }

  .controls {
    display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
    padding: 14px 16px; margin-bottom: 20px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  }
  .controls label { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 11px; }
  input[type=range] { width: 120px; accent-color: var(--brand); }
  output { font-variant-numeric: tabular-nums; color: var(--text); min-width: 34px; }

  .card {
    display: grid; grid-template-columns: 150px 1fr 1fr; gap: 0;
    margin-bottom: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  @media (max-width: 820px) { .card { grid-template-columns: 1fr; } }
  .meta { padding: 18px 16px; background: var(--panel); }
  .meta .name { font-size: 12px; color: var(--text); margin-bottom: 6px; }
  .meta .desc { font-size: 10.5px; color: var(--dim); line-height: 1.6; }
  .bed { padding: 26px 22px; display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
  .bed.dark { background: #10141c; }
  .bed.light { background: var(--cream); }

  .lockup { display: flex; align-items: center; gap: .5em; }
  .lockup svg { width: auto; flex: none; }
  .word { display: flex; flex-direction: column; line-height: .92; }
  .word b { display: block; font-weight: inherit; white-space: nowrap; }
  .word .top { text-align: left; }

  .pick { margin-top: 10px; padding: 5px 10px; font: inherit; font-size: 10.5px;
    border: 1px solid var(--line); border-radius: 6px; background: #1e2634; color: var(--text); cursor: pointer; }
  .pick:hover { border-color: var(--brand); }
  .hint { margin-top: 16px; color: var(--dim); font-size: 11px; line-height: 1.7; }
  .hint b { color: var(--text); }
</style>
</head>
<body>

<h1>디스플레이 서체 비교</h1>
<p class="sub">같은 락업 구조에 서체만 바꿔 얹었습니다 · 전부 Google Fonts라 상업 사용이 자유롭습니다</p>

<div class="controls">
  <label>크기 <input type="range" id="size" min="18" max="64" value="34"><output id="o-size"></output></label>
  <label>윗줄 비율 <input type="range" id="topScale" min="60" max="140" value="100"><output id="o-topScale"></output></label>
  <label>심볼 <input type="range" id="sym" min="0" max="200" value="120"><output id="o-sym"></output></label>
  <label>자간 <input type="range" id="track" min="-4" max="16" value="0"><output id="o-track"></output></label>
</div>

<div id="list"></div>

<p class="hint">
  <b>왼쪽 다크가 사이드바, 오른쪽 크림이 팩 앞면 상황</b>입니다. 두 줄 폭은 윗줄 자간으로 자동 정렬됩니다.<br>
  고르실 때 기준 — <b>M과 S가 뭉개지지 않는가</b>, <b>작은 크기에서도 인상이 유지되는가</b>, <b>심볼의 각진 모서리와 싸우지 않는가</b>.
</p>

<script src="symbol.js"></script>
<script>
const FONTS = [
  { name: 'Archivo Black',        css: '"Archivo Black"',        weight: 400, desc: '견고한 그로테스크. 임팩트는 크되 튀지 않음. 가장 안전한 선택' },
  { name: 'Anton',                css: 'Anton',                  weight: 400, desc: '좁고 무거운 포스터체. 인쇄물 · 패키지 인상이 가장 강함' },
  { name: 'Bebas Neue',           css: '"Bebas Neue"',           weight: 400, desc: '길쭉한 대문자 전용. 강하지만 매우 흔하게 쓰임' },
  { name: 'Big Shoulders',        css: '"Big Shoulders Display"',weight: 800, desc: '좁고 각진 산세리프. 모따기 심볼과 결이 가까움' },
  { name: 'Chivo Black',          css: 'Chivo',                  weight: 900, desc: '묵직한 그로테스크. Archivo보다 살짝 부드러움' },
  { name: 'Space Grotesk',        css: '"Space Grotesk"',        weight: 700, desc: '기하학 + 독특한 디테일. 테크 인상이 섞임' },
  { name: 'Unbounded',            css: 'Unbounded',              weight: 800, desc: '기하학 디스플레이. 개성이 가장 강하고 호불호도 큼' },
  { name: 'Bricolage Grotesque',  css: '"Bricolage Grotesque"',  weight: 800, desc: '편집 디자인 계열. 불규칙한 디테일이 인쇄물과 어울림' },
];

const P = { size: 34, topScale: 100, sym: 120, track: 0 };

const symbolSvg = size =>
  window.CafeMastersSymbol.svgFor(window.CafeMastersSymbol.DEFAULTS, 'currentColor', 'tf', size);

function buildCard(font, index) {
  const bed = (kind, color) => `
    <div class="bed ${kind}" style="color:${color}">
      <div class="lockup" data-font="${index}" data-scale="1"></div>
      <div class="lockup" data-font="${index}" data-scale="0.55"></div>
    </div>`;

  return `<div class="card">
    <div class="meta">
      <div class="name">${font.name}</div>
      <div class="desc">${font.desc}</div>
      <button class="pick" data-name="${font.name}">이걸로</button>
    </div>
    ${bed('dark', 'var(--brand)')}
    ${bed('light', '#1b2230')}
  </div>`;
}

document.getElementById('list').innerHTML = FONTS.map(buildCard).join('');

/**
 * 두 줄 폭을 맞춥니다.
 *
 * CSS letter-spacing은 마지막 글자 뒤에도 붙으므로, 그만큼 음수 마진으로 되돌려야
 * 실제 폭이 계산과 맞습니다. 이걸 빼먹으면 윗줄이 항상 한 칸씩 넓어집니다.
 */
function alignRow(lockup) {
  const font = FONTS[Number(lockup.dataset.font)];
  const scale = Number(lockup.dataset.scale);
  const size = P.size * scale;
  const topSize = size * (P.topScale / 100);

  lockup.innerHTML =
    (P.sym > 0 ? symbolSvg(Math.round((size * 1.9 + P.size * 0.2) * (P.sym / 100))) : '')
    + `<span class="word" style="font-family:${font.css};font-weight:${font.weight}">
         <b class="top" style="font-size:${topSize}px">CAFE</b>
         <b class="bottom" style="font-size:${size}px;letter-spacing:${P.track * scale}px">MASTERS</b>
       </span>`;

  const top = lockup.querySelector('.top');
  const bottom = lockup.querySelector('.bottom');
  const target = bottom.getBoundingClientRect().width;

  top.style.letterSpacing = '0px';
  const natural = top.getBoundingClientRect().width;
  const spacing = (target - natural) / 'CAFE'.length;

  top.style.letterSpacing = `${spacing}px`;
  top.style.marginRight = `${-spacing}px`;
}

function render() {
  document.querySelectorAll('.lockup').forEach(alignRow);
}

['size', 'topScale', 'sym', 'track'].forEach(key => {
  const input = document.getElementById(key);
  const out = document.getElementById('o-' + key);
  const sync = () => { P[key] = Number(input.value); out.textContent = input.value; render(); };
  input.addEventListener('input', sync);
  sync();
});

document.addEventListener('click', event => {
  const button = event.target.closest('.pick');
  if (button) navigator.clipboard.writeText(button.dataset.name);
});

// 웹폰트가 도착하기 전에 재면 폭이 어긋납니다
document.fonts.ready.then(render);
</script>
</body>
</html>
